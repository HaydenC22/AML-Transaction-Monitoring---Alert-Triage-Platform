name: aml-transaction-monitoring

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  image: aml-transaction-monitoring-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@pg-airflow/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-change-me-locally}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    WAREHOUSE_DATABASE_URL: postgresql://${WAREHOUSE_POSTGRES_USER:-aml}:${WAREHOUSE_POSTGRES_PASSWORD:-aml}@pg-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-aml_warehouse}
    WAREHOUSE_POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-aml}
    WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:-aml}
    WAREHOUSE_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-aml_warehouse}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    PYTHONPATH: /opt:/opt/scripts:/opt/great_expectations
    DBT_LOG_PATH: /tmp/dbt_logs
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - ./dbt:/opt/dbt
    - ./detection:/opt/detection
    - ./great_expectations:/opt/great_expectations
    - ./data:/opt/data
    - ./docs:/opt/docs
    - ./scripts:/opt/scripts
  depends_on:
    pg-airflow:
      condition: service_healthy
    pg-warehouse:
      condition: service_healthy

services:
  pg-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:-aml}
      POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-aml_warehouse}
    ports:
      - "5433:5432"
    volumes:
      - pg_warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_POSTGRES_USER:-aml}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: loads the sample dataset into raw.paysim_transactions, then builds and
  # tests the full dbt star schema. Exits when done; re-run with `docker compose run pipeline-init`.
  pipeline-init:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    environment:
      WAREHOUSE_DATABASE_URL: postgresql://${WAREHOUSE_POSTGRES_USER:-aml}:${WAREHOUSE_POSTGRES_PASSWORD:-aml}@pg-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-aml_warehouse}
      WAREHOUSE_POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER:-aml}
      WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD:-aml}
      WAREHOUSE_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB:-aml_warehouse}
      DBT_LOG_PATH: /tmp/dbt_logs
    volumes:
      - ./dbt:/opt/dbt
      - ./scripts:/opt/scripts
      - ./data:/opt/data
    working_dir: /opt/dbt
    depends_on:
      pg-warehouse:
        condition: service_healthy
    restart: "no"

  # One-shot: runs after pipeline-init builds the star schema. Runs the detection
  # engine, builds+tests the marts/detection layer, and generates the evaluation
  # report -- so `docker compose up` alone leaves alerts ready for the API/frontend
  # to show, without requiring a manual Airflow DAG trigger first. The Airflow DAG
  # remains the way to re-run this same sequence on a schedule.
  detection-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        python -m detection.run_detection &&
        cd /opt/dbt &&
        dbt run --select marts.detection --profiles-dir profiles --target docker &&
        dbt test --select marts.detection --profiles-dir profiles --target docker &&
        cd /opt &&
        python -m detection.evaluation.evaluate_thresholds
    depends_on:
      pipeline-init:
        condition: service_completed_successfully
      pg-warehouse:
        condition: service_healthy
    restart: "no"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  api:
    build:
      context: ./api
    environment:
      API_DATABASE_URL: postgresql://${WAREHOUSE_POSTGRES_USER:-aml}:${WAREHOUSE_POSTGRES_PASSWORD:-aml}@pg-warehouse:5432/${WAREHOUSE_POSTGRES_DB:-aml_warehouse}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      pg-warehouse:
        condition: service_healthy
      detection-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_airflow_data:
  pg_warehouse_data:
  airflow_logs:
