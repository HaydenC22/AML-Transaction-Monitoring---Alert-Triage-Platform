version: 2

models:
  - name: fct_alerts
    description: >
      One row per alert generated by the detection engine, enriched with the
      triggering transaction's context from fact_transactions.
    columns:
      - name: alert_id
        tests: [not_null, unique]
      - name: transaction_key
        tests:
          - not_null
          - relationships:
              to: ref('fact_transactions')
              field: transaction_key
      - name: severity
        tests:
          - accepted_values:
              values: ["low", "medium", "high", "critical"]

  - name: fct_alert_rule_triggers
    description: Junction table of which rule(s) triggered each alert (empty for ML-only alerts).
    columns:
      - name: alert_id
        tests:
          - relationships:
              to: ref('fct_alerts')
              field: alert_id
      - name: rule_name
        tests:
          - accepted_values:
              values: ["structuring", "velocity_spike", "high_risk_jurisdiction", "circular_flow"]
