name: aml_warehouse
version: "1.0.0"
config-version: 2

profile: aml_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  aml_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: marts_core
      detection:
        +materialized: table
        +schema: marts_detection

seeds:
  aml_warehouse:
    +schema: seeds
    geography_risk_lookup:
      +column_types:
        country_code: varchar(2)
